# Bank-owner token service — ONE parameterized `owner` service.
#
# Each commercial bank VM runs its OWN owner FSC node via this file. The
# per-bank values come from the environment (set by scripts/deploy-bank.sh):
#   OWNER_NODE     owner{k}
#   OWNER_HOSTNAME owner{k}               (FSC hostname owner{k}.sworna.example.com)
#   OWNER_REST_PORT 9200+100(k-1)         (host port -> container :9000)
#   OWNER_P2P_PORT   9201+100(k-1)        (exposed FSC P2P port)
#
# Run from token-services/:
#   docker compose -f docker-compose.bank.yaml \
#       [-f docker-compose.bank.net.yaml] \
#       up -d --build owner
#
# The owner conf (owner/conf/<OWNER_NODE>/core.yaml) is rendered by
# scripts/bank-network.sh from the template. The owner joins the external
# fabric_test network; across real VMs the cross-host DNS comes from the
# generated docker-compose.bank.net.yaml (extra_hosts) — see
# docs/token-network/09-distributed-deployment.md.
networks:
  test:
    name: fabric_test
    external: true

services:
  owner:
    hostname: ${OWNER_HOSTNAME:?OWNER_HOSTNAME (e.g. owner1) must be set}.sworna.example.com
    network_mode: host
    restart: always
    environment:
      - PORT=${OWNER_REST_PORT:-9200}
      - CONF_DIR=/conf
    build:
      context: ./owner
      dockerfile: ../Dockerfile
    volumes:
      - ./data/${OWNER_NODE:?OWNER_NODE (e.g. owner1) must be set}:/var/fsc/data/${OWNER_NODE}
      - ./owner/conf/${OWNER_NODE}:/conf:ro
      - ./keys:/var/fsc/keys:ro
      - ../network/organizations:/var/fsc/fabric/organizations:ro
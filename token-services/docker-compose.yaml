# Central-bank token services (issuer + auditor + API docs).
#
# The commercial-bank owner nodes are NOT part of the CB host; each bank runs
# its own owner service from docker-compose.bank.yaml on its own VM.
networks:
  test:
    name: fabric_test
    external: true

services:
  auditor:
    hostname: auditor.sworna.example.com
    restart: always
    build:
      context: ./auditor
      dockerfile: ../Dockerfile
    volumes:
      - ./data/auditor:/var/fsc/data/auditor
      - ./auditor/conf:/conf:ro
      - ./keys:/var/fsc/keys:ro
      - ../network/organizations:/var/fsc/fabric/organizations:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    expose:
      - 9001
    networks:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/readyz"]
      interval: "5s"
      timeout: "1s"
      retries: 20

  issuer:
    hostname: issuer.sworna.example.com
    restart: always
    build:
      context: ./issuer
      dockerfile: ../Dockerfile
    volumes:
      - ./data/issuer:/var/fsc/data/issuer
      - ./issuer/conf:/conf:ro
      - ./keys:/var/fsc/keys:ro
      - ../network/organizations:/var/fsc/fabric/organizations:ro
    ports:
      - "9100:9000"
      - "9101:9101"
    expose:
      - 9101
    networks:
      - test
    depends_on:
      auditor:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      - URL=/swagger.yaml
    volumes:
      - ./swagger.yaml:/usr/share/nginx/html/swagger.yaml
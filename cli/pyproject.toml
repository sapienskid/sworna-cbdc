[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sworna-cli"
version = "0.1.0"
description = "Unified CLI for the Sworna CBDC Network"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sworna = "sworna.main:main"

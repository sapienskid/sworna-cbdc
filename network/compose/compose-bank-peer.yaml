# Per-bank Fabric peer + CA — parameterized, run on the bank's OWN VM.
#
# One file serves any bank; the per-bank values come from the environment
# (set by scripts/bank-network.sh):
#   BANK_ORG          bank{k}
#   BANK_MSP          Bank{k}MSP
#   BANK_PEER_PORT    9051+2000(k-1)
#   BANK_CC_PORT      BANK_PEER_PORT+1
#   BANK_CA_PORT      8054+1000(k-1)
#   BANK_CA_NAME      ca-bank{k}
#   BANK_CA_CONT      ca_bank{k}
#   BANK_CA_DATA      ../organizations/fabric-ca/bank{k}
#   CCAAS_PEERNAME    peer0bank{k}
#   SWORNA_CB_HOST    IP of the central-bank host (orderer + peer0.centralbank)
#   DOCKER_SOCK       default /var/run/docker.sock
#
# Project directory is network/compose, so `../` resolves to network/.
networks:
  test:
    name: fabric_test
    external: true

volumes:
  peer-data:

services:
  bank-ca:
    image: hyperledger/fabric-ca:1.5.22
    restart: always
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=${BANK_CA_NAME:?BANK_CA_NAME must be set}
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=${BANK_CA_PORT:?BANK_CA_PORT must be set}
    ports:
      - "${BANK_CA_PORT}:${BANK_CA_PORT}"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ${BANK_CA_DATA:-../organizations/fabric-ca/bank}:/etc/hyperledger/fabric-ca-server
    container_name: ${BANK_CA_CONT:?BANK_CA_CONT must be set}
    networks:
      - test

  bank-peer:
    container_name: peer0.${BANK_ORG:?BANK_ORG must be set}.sworna.example.com
    image: hyperledger/fabric-peer:3.1.5
    restart: always
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.${BANK_ORG}.sworna.example.com
      - CORE_PEER_ADDRESS=peer0.${BANK_ORG}.sworna.example.com:${BANK_PEER_PORT:?BANK_PEER_PORT must be set}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${BANK_PEER_PORT}
      - CORE_PEER_CHAINCODEADDRESS=peer0.${BANK_ORG}.sworna.example.com:${BANK_CC_PORT:?BANK_CC_PORT must be set}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${BANK_CC_PORT}
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.${BANK_ORG}.sworna.example.com:${BANK_PEER_PORT}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.${BANK_ORG}.sworna.example.com:${BANK_PEER_PORT}
      - CORE_PEER_LOCALMSPID=${BANK_MSP:?BANK_MSP must be set}
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"${CCAAS_PEERNAME:?CCAAS_PEERNAME must be set}"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/${BANK_ORG}.sworna.example.com/peers/peer0.${BANK_ORG}.sworna.example.com:/etc/hyperledger/fabric
      - peer-data:/var/hyperledger/production
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
    working_dir: /root
    command: peer node start
    ports:
      - "${BANK_PEER_PORT}:${BANK_PEER_PORT}"
    networks:
      - test